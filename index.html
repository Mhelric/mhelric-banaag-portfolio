<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mhelric Banaag — Front-End Developer & Artist</title>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light') {
            document.documentElement.classList.remove('dark')
            document.documentElement.classList.add('light')
          }
        } catch (e) {}
      })()
    </script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-text antialiased selection:bg-accent/25 selection:text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
